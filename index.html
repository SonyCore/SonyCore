<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sonia Fatholahi — Senior Software Engineer specializing in Backend & DevOps with Golang, Python, Linux, and Docker." />
    <meta name="theme-color" content="#08090b" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sonia Fatholahi · Senior Software Engineer · Backend & DevOps" />
    <meta property="og:description" content="Self-taught senior software engineer specializing in Backend & DevOps with Golang, Python, Linux, and Docker." />
    <meta property="og:image" content="/avatar.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sonia Fatholahi · Senior Software Engineer · Backend & DevOps" />
    <meta name="twitter:description" content="Self-taught senior software engineer specializing in Backend & DevOps with Golang, Python, Linux, and Docker." />
    <meta name="twitter:image" content="/avatar.png" />

    <!--
      Must stay ahead of every stylesheet link. A pending stylesheet blocks
      execution of any later script, and a blocked inline script blocks the
      HTML parser — which would stall the boot screen below out of existence.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.add(theme);
        } catch (_) {}
        try {
          var loc = localStorage.getItem("locale");
          if (!loc || !/^(en|fa|tr)$/.test(loc)) {
            var b = (navigator.language || "en").slice(0, 2).toLowerCase();
            loc = /^(en|fa|tr)$/.test(b) ? b : "en";
          }
          document.documentElement.lang = loc;
          document.documentElement.dir = loc === "fa" ? "rtl" : "ltr";
        } catch (_) {}
      })();
    </script>

    <link rel="preload" href="/avatar.png" as="image" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://github-contributions-api.jogruber.de" crossorigin />
    <link rel="preconnect" href="https://streak-stats.demolab.com" />
    <!--
      Loaded non-render-blocking: media="print" keeps it off the critical path,
      then onload promotes it. The faces use display=swap anyway, so text was
      never waiting on this request.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500&family=Vazirmatn:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500&family=Vazirmatn:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Sonia Fatholahi · Senior Software Engineer · Backend & DevOps</title>

    <!--
      Critical CSS. This runs before the Tailwind bundle arrives, so it has to
      stand alone: it paints the correct background (no white flash in dark
      mode), defines .sr-only so the skip link stays hidden instead of
      rendering as bare text, and styles the boot screen. Colours are the
      palette's literals because the CSS custom properties aren't loaded yet.
    -->
    <style>
      html {
        background: #fbfbfc;
      }
      html.dark {
        background: #08090b;
      }
      body {
        margin: 0;
      }

      /* Matches Tailwind's .sr-only; the bundle redefines it identically. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fbfbfc;
        transition: opacity 0.3s ease;
      }
      html.dark #boot {
        background: #08090b;
      }
      #boot.boot-done {
        opacity: 0;
        pointer-events: none;
      }

      /* Fades in slightly late, so a fast load shows a calm background rather
         than a spinner that flashes for one frame. */
      .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        opacity: 0;
        animation: boot-in 0.3s ease-out 0.2s forwards;
      }
      .boot-mark {
        position: relative;
        width: 48px;
        height: 48px;
      }
      .boot-ring,
      .boot-arc {
        position: absolute;
        inset: 0;
        border-radius: 50%;
      }
      .boot-ring {
        border: 1px solid #e3e5ea;
      }
      html.dark .boot-ring {
        border-color: #1c2026;
      }
      .boot-arc {
        border: 1px solid transparent;
        border-top-color: #0ea5e9;
        animation: boot-spin 1.1s linear infinite;
      }
      html.dark .boot-arc {
        border-top-color: #7dd3fc;
      }
      .boot-initials,
      .boot-label {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
      }
      .boot-initials {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 500;
        color: #0ea5e9;
      }
      html.dark .boot-initials {
        color: #7dd3fc;
      }
      .boot-label {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6b7280;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-arc {
          animation: none;
        }
        .boot-inner {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <a
      href="#home"
      class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:start-2 focus:z-50 focus:rounded-md focus:bg-primary focus:px-4 focus:py-2 focus:text-primary-foreground"
    >
      Skip to content
    </a>

    <!-- Boot screen: covers the gap before React mounts. main.tsx fades and
         removes it on first paint. Initials are inlined because this has to
         render without the app bundle. -->
    <div id="boot" role="status" aria-live="polite" aria-label="Loading">
      <div class="boot-inner">
        <div class="boot-mark" aria-hidden="true">
          <span class="boot-ring"></span>
          <span class="boot-arc"></span>
          <span class="boot-initials">SF</span>
        </div>
        <p class="boot-label">Loading</p>
      </div>
    </div>
    <noscript>
      <!-- Nothing will ever remove the overlay without JS. -->
      <style>
        #boot {
          display: none;
        }
      </style>
    </noscript>
    <script>
      // Safety valve: if the module never executes (network failure, parse
      // error), don't strand the visitor behind a permanent spinner.
      setTimeout(function () {
        var boot = document.getElementById("boot");
        if (boot) boot.classList.add("boot-done");
      }, 15000);
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
